{% extends "base.html" %}
{% block title %}Ingreso al sistema{% endblock %}
{% block content %}
<div class="container my-4" style="max-width: 640px;">
  <div class="card shadow-sm">
    <div class="card-body p-4">
      <h1 class="h4 mb-4 text-center">Ingreso al sistema</h1>
      <form method="post" action="{{ url_for('auth.login_post') }}" novalidate>
        <div class="row g-3">
          <div class="col-12">
            <div class="form-floating">
              <input type="text" class="form-control" id="usuario" name="usuario" placeholder="usuario" required>
              <label for="usuario">Usuario</label>
            </div>
          </div>
          <div class="col-12">
            <div class="form-floating">
              <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
              <label for="password">Contraseña</label>
            </div>
          </div>
        </div>
        <div class="d-grid mt-4">
          <button class="btn btn-primary">Entrar</button>
        </div>
      </form>
      <p class="mt-3 mb-0 text-center">¿No tienes cuenta? <a href="{{ url_for('auth.registro') }}">Regístrate</a></p>
    </div>
  </div>
</div>
{% endblock %}
