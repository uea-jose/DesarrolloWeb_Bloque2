{% extends "base.html" %}
{% block title %}{{ 'Nuevo' if modo=='crear' else 'Editar' }} Producto{% endblock %}
{% block content %}
<div class="container my-4">
  <h2 class="mb-3">{{ 'Ingresar' if modo=='crear' else 'Editar' }} producto</h2>
  <form method="post" class="row g-3">
    <div class="col-md-6">
      <label class="form-label">Nombre</label>
      <input name="nombre" class="form-control" required value="{{ (prod['nombre'] if prod else '') }}">
    </div>
    <div class="col-md-6">
      <label class="form-label">Tipo</label>
      <select name="tipo" class="form-select" required>
        {% set val = (prod['tipo'] if prod else 'Femenino') %}
        {% for t in ['Femenino','Masculino','Unisex'] %}
          <option value="{{t}}" {{ 'selected' if t==val else '' }}>{{t}}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-md-4">
      <label class="form-label">Precio (USD)</label>
      <input type="number" step="0.01" min="0" name="precio" class="form-control"
             required value="{{ (prod['precio'] if prod else '') }}">
    </div>
    <div class="col-md-4">
      <label class="form-label">Stock</label>
      <input type="number" min="0" name="stock" class="form-control"
             required value="{{ (prod['stock'] if prod else 0) }}">
    </div>
    <div class="col-12 d-flex gap-2">
      <button class="btn btn-primary" type="submit">{{ 'Guardar' if modo=='crear' else 'Actualizar' }}</button>
      <a class="btn btn-secondary" href="{{ url_for('main.productos_list') }}">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}

{% block extra_js %}
<script>
(function(){
  const input = document.querySelector('input[name="nombre"]');
  if (!input) return;
  let hint = document.getElementById('estadoNombre');
  if (!hint) {
    hint = document.createElement('small');
    hint.id = 'estadoNombre';
    hint.className = 'form-text';
    input.parentNode.insertBefore(hint, input.nextSibling);
  }
  const setMsg = (m, cls) => { hint.textContent = m; hint.className = 'form-text ' + (cls||''); };
  let timer;
  input.addEventListener('input', () => {
    clearTimeout(timer);
    const val = input.value.trim();
    if (!val) { setMsg('', ''); return; }
    timer = setTimeout(async () => {
      try {
        const u = new URL('{{ url_for("main.api_check_nombre") }}', window.location.origin);
        u.searchParams.set('nombre', val);
        const pid = {{ (prod.id if prod else 'null')|safe }};
        if (pid) u.searchParams.set('exclude_id', pid);
        const r = await fetch(u);
        const data = await r.json();
        if (data.available) setMsg('Disponible ✓', 'text-success');
        else setMsg('Ya existe un producto con ese nombre', 'text-danger');
      } catch (e) {}
    }, 250);
  });
})();
</script>
{% endblock %}
