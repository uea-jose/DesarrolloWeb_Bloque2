
{% extends "base.html" %}
{% block title %}{{ 'Editar' if prod else 'Nuevo' }} producto{% endblock %}
{% block content %}
<div class="container my-4">
  <h2 class="text-primary">{{ 'Editar' if prod else 'Ingresar' }} producto</h2>
  <form method="post" class="mt-3">
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Nombre</label>
        <input name="nombre" class="form-control" required value="{{ prod.nombre if prod }}">
        <div class="form-text" id="nombre-help"></div>
      </div>
      <div class="col-md-6">
        <label class="form-label">Categoría</label>
        <select class="form-select" name="categoria_id" required>
          {% for c in categorias %}
            <option value="{{ c.id }}" {{ 'selected' if prod and prod.categoria_id==c.id }}>{{ c.nombre }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-12">
        <label class="form-label">Descripción</label>
        <textarea name="descripcion" class="form-control" rows="2">{{ prod.descripcion if prod }}</textarea>
      </div>
      <div class="col-md-4">
        <label class="form-label">Precio (S/)</label>
        <input type="number" step="0.01" min="0" name="precio" class="form-control" required value="{{ '%.2f'|format(prod.precio) if prod }}">
      </div>
      <div class="col-md-4">
        <label class="form-label">Stock</label>
        <input type="number" min="0" name="stock" class="form-control" required value="{{ prod.stock if prod else 0 }}">
      </div>
    </div>
    <div class="mt-4 d-flex gap-2">
      <button class="btn btn-primary">Guardar</button>
      <a class="btn btn-secondary" href="{{ url_for('main.productos_list') }}">Cancelar</a>
    </div>
  </form>
</div>

<script>
// Comprobación de nombre único
(function(){
  const input = document.querySelector('input[name="nombre"]');
  const help = document.getElementById('nombre-help');
  function setMsg(msg, cls) { help.textContent = msg; help.className = 'form-text ' + (cls||''); }
  let tm = null;
  input.addEventListener('input', () => {
    clearTimeout(tm);
    tm = setTimeout(async () => {
      try {
        const u = new URL('{{ url_for("main._check_nombre") }}', window.location.origin);
        const val = input.value || '';
        u.searchParams.set('nombre', val);
        const pid = {{ (prod.id if prod else 'null')|safe }};
        if (pid) u.searchParams.set('exclude_id', pid);
        const r = await fetch(u);
        const data = await r.json();
        if (data.available) setMsg('Disponible ✓', 'text-success'); else setMsg('Ya existe ese nombre', 'text-danger');
      } catch (e) {}
    }, 300);
  });
})();
</script>
{% endblock %}
