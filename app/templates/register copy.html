{% extends "base.html" %}
{% block title %}Registro de usuarios{% endblock %}
{% block content %}
<div class="container my-4" style="max-width: 640px;">
  <div class="card shadow-sm">
    <div class="card-body p-4">
      <h1 class="h4 mb-4 text-center">Registro de usuarios</h1>
      <form method="post" action="{{ url_for('auth.registro_post') }}" novalidate>
        <div class="row g-3">
          <div class="col-12">
            <div class="form-floating">
              <input type="text" class="form-control" id="usuario" name="usuario" placeholder="usuario" required>
              <label for="usuario">Usuario</label>
            </div>
          </div>
          <div class="col-12">
            <div class="form-floating">
              <input type="email" class="form-control" id="email" name="email" placeholder="email@ejemplo.com">
              <label for="email">Email (opcional)</label>
            </div>
          </div>
          <div class="col-12">
            <div class="form-floating">
              <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
              <label for="password">Contraseña</label>
            </div>
            <div class="form-text">La contraseña se almacena cifrada (Werkzeug).</div>
          </div>
        </div>
        <div class="d-grid mt-4">
          <button class="btn btn-primary">Registrarme</button>
        </div>
      </form>
      <p class="mt-3 mb-0 text-center">¿Ya tienes cuenta? <a href="{{ url_for('auth.login') }}">Inicia sesión</a></p>
    </div>
  </div>
</div>
{% endblock %}
