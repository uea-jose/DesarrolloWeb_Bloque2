<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Essenza Store{% endblock %}</title>

  <!-- Bootstrap + Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <!-- Tus estilos -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
<nav class="navbar navbar-expand-lg bg-light sticky-top">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center gap-2" href="{{ url_for('index') }}">
      <img src="{{ url_for('static', filename='img/essenza_logo.png') }}" alt="Essenza" height="32">
      <span class="brand-gradient">Essenza Store</span>
    </a>
    <div class="ms-auto">
      {% if current_user.is_authenticated %}
        <a class="btn btn-outline-primary btn-sm me-2" href="{{ url_for('auth.dashboard') }}">
          <i class="bi bi-speedometer2 me-1"></i>Dashboard
        </a>
        <a class="btn btn-outline-danger btn-sm" href="{{ url_for('auth.logout') }}">
          <i class="bi bi-box-arrow-right me-1"></i>Salir
        </a>
      {% else %}
        <a class="btn btn-outline-primary btn-sm me-2" href="{{ url_for('auth.login') }}">
          <i class="bi bi-box-arrow-in-right me-1"></i>Entrar
        </a>
        <a class="btn btn-outline-secondary btn-sm" href="{{ url_for('auth.register') }}">
          <i class="bi bi-person-plus me-1"></i>Registrarme
        </a>
      {% endif %}
    </div>
  </div>
</nav>

<div class="container mt-3">
  {% with messages = get_flashed_messages(with_categories=True) %}
    {% for cat, msg in messages %}
      <div class="alert alert-{{ cat }} alert-dismissible fade show shadow-sm" role="alert">
        {{ msg }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}
  {% endwith %}
</div>

{% block content %}{% endblock %}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
