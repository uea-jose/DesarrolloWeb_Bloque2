<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Disprokin{% endblock %}</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
    crossorigin="anonymous" />

  <!-- Iconos Bootstrap -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

  <!-- Estilo personalizado -->
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>

<!-- Navbar -->
<!-- Navbar fija y siempre horizontal -->
<nav class="navbar navbar-expand" style="background: linear-gradient(to right, #d0e8ff, #7fb3ff);">
  <div class="container-fluid">
    <!-- Logo / Marca -->
    <a class="navbar-brand fw-bold" href="{{ url_for('index') }}">Aromas & Fragancias</a>

    <!-- Links horizontales siempre visibles -->
    <ul class="navbar-nav ms-3 me-auto mb-2 mb-lg-0 d-flex flex-row">
      <li class="nav-item">
        <a class="nav-link" href="{{ url_for('index') }}">Inicio</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="{{ url_for('about') }}">Acerca de</a>
      </li>
    </ul>


    </form>
  </div>
</nav>


<!-- CONTENIDO VARIABLE -->
<main class="container my-4">
  {% block content %}{% endblock %}
</main>

<!-- Footer -->
<footer class="text-center text-white mt-5" style="background: linear-gradient(to right, #7fb3ff, #d0e8ff);">
  <div class="container p-4 pb-0">
    <section class="mb-4 text-center">
      <a class="btn btn-red-social btn-facebook" href="https://facebook.com/Disprokin" target="_blank">
        <i class="bi bi-facebook"></i> Facebook
      </a>
      <a class="btn btn-red-social btn-instagram" href="https://instagram.com/Disprokin" target="_blank">
        <i class="bi bi-instagram"></i> Instagram
      </a>
      <a class="btn btn-red-social btn-tiktok" href="https://tiktok.com/@Disprokin" target="_blank">
        <i class="bi bi-tiktok"></i> TikTok
      </a>
    </section>
  </div>
  <div class="text-center p-3 text-dark bg-light" style="font-size: 0.9rem;">
    © 2025 Disprokin. Todos los derechos reservados. | Desarrollado por Dispro
  </div>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
  integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
  crossorigin="anonymous"></script>
</body>
</html>

</html>
