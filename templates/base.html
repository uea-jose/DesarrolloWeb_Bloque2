<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Instituto Técnico{% endblock %}</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Iconos Bootstrap -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

  <!-- Estilo personalizado -->
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>

<!-- Barra de noticias -->
<div class="top-bar text-white py-1 px-3">
  <span class="news-label">Noticias:</span>
  <span class="news-content">Nuevos cursos de Redes Avanzadas disponibles</span>
</div>

<!-- Navbar -->

<nav class="navbar navbar-expand navbar-wordpress">
  <div class="container-fluid">

    <a class="navbar-brand fw-bold instituto-tecnico" href="{{ url_for('index') }}">
      Instituto Técnico
    </a>
    <ul class="navbar-nav ms-3 me-auto mb-2 mb-lg-0 d-flex flex-row">
      <li class="nav-item"><a class="nav-link" href="{{ url_for('index') }}">Inicio</a></li>
      <li class="nav-item"><a class="nav-link" href="{{ url_for('about') }}">Sobre Nosotros</a></li>
      <li class="nav-item"><a class="nav-link" href="{{ url_for('contacto') }}">Contacto</a></li>
    </ul>
  </div>
</nav>


<!-- CONTENIDO VARIABLE -->
<main class="container my-4">
  {% block content %}{% endblock %}
</main>

<!-- Footer -->
<footer class="text-center text-white mt-5" style="background: linear-gradient(to right, #1d2d50, #0077b6);">
  <div class="container p-4 pb-0">
    <section class="mb-4 text-center">
      <a class="btn btn-red-social btn-facebook" href="#" target="_blank">
        <i class="bi bi-facebook"></i> Facebook
      </a>
      <a class="btn btn-red-social btn-instagram" href="#" target="_blank">
        <i class="bi bi-instagram"></i> Instagram
      </a>
      <a class="btn btn-red-social btn-tiktok" href="#" target="_blank">
        <i class="bi bi-tiktok"></i> TikTok
      </a>
    </section>
  </div>
  <div class="text-center p-3 text-dark bg-light" style="font-size: 0.9rem;">
    © 2025 Instituto Técnico. Todos los derechos reservados.
  </div>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
